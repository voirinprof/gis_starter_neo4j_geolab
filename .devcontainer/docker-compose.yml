version: "3.9"

services:
  python:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/gis_starter_neo4j_geolab:cached
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j_pwd

  neo4j:
    image: neo4j:4.4
    ports:
      - "7474:7474"   # HTTP interface
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/neo4j_pwd
      
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
    expose:
      - "7687"

volumes:
  neo4j_data:
  neo4j_import: